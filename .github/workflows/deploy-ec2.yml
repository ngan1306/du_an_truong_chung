name: Deploy Fullstack to AWS EC2

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  # ==========================================
  #  CI JOB — build & test khi tạo Pull Request
  # ==========================================
  ci-build:
    name: CI – Build & Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python (Backend)
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd backend
          python -m pytest -v || true

      - name: Setup NodeJS (Frontend)
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React App
        run: |
          cd frontend
          CI=false npm run build

      - name: Test Docker Build Backend
        run: docker build -t backend-test ./backend

      - name: Test Docker Build Frontend
        run: docker build -t frontend-test ./frontend

  # ==========================================
  #  CD JOB — deploy lên EC2 khi push main
  # ==========================================
  cd-deploy:
    name: CD – Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/du_an_truong/du_an_truong_chung
            git pull

            # Cập nhật .env nếu chưa có
            [ -f .env ] || cp .env.example .env

            # Build lại toàn bộ stack (backend + frontend + mysql)
            docker compose -f docker-compose.aws.yml build --no-cache
            docker compose -f docker-compose.aws.yml up -d

            # Seed DB (schema) — idempotent, chỉ chạy khi cần
            bash scripts/seed-db.sh || true

            docker system prune -f
