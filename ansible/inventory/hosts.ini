# Ansible Inventory - Liệt kê máy chủ web
# Định nghĩa các nhóm máy chủ

[web]
# Máy chủ web 1 - dùng SSH key
web1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Máy chủ web 2 - dùng mật khẩu (cần sshpass)
# web2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_pass=YourPassword

# Máy chủ cục bộ để test (localhost)
#localhost ansible_host=127.0.0.1 ansible_connection=local

[web:vars]
ansible_python_interpreter=/usr/bin/python3
# ansible_port=22

# Cách chạy:
#   ansible-playbook -i inventory/hosts.ini playbook/deploy.yml
#   Chỉ chạy 1 host:  ansible-playbook -i inventory/hosts.ini playbook/deploy.yml --limit web1
#   Kiểm tra kết nối: ansible web -i inventory/hosts.ini -m ping
